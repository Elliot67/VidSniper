name: VidSniper

options:
  bundleIdPrefix: com.elintz
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # Langue source du code ; le français est dans les String Catalogs (Resources/*.xcstrings).
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: T9WD2H73Y6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  VidSniper:
    type: application
    platform: macOS
    sources:
      - path: VidSniper
    entitlements:
      path: VidSniper/Resources/VidSniper.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: VidSniper/Resources/Info.plist
      properties:
        CFBundleDisplayName: VidSniper
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        # Textes traduits dans Resources/InfoPlist.xcstrings.
        NSMicrophoneUsageDescription: VidSniper records the microphone during your screen captures.
        # Vidéos ouvrables depuis le Finder ("Ouvrir avec") ou en les glissant sur l'icône du Dock.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elintz.VidSniper
        GENERATE_INFOPLIST_FILE: NO
        # Icône générée par scripts/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
